
# ============================================================
# MixinEnhance - GitHub Actions Build Workflow
# ============================================================
# 触发条件：
#   - 每次推送到 main 分支时自动触发
#   - 创建/更新 Pull Request 时也会触发
#   - 也可以手动触发（Workflow Dispatch）
# ============================================================

name: Build and Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ '25' ]

    steps:
      # ---------- 1. 检出代码 ----------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 2. 配置 JDK ----------
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: '${{ matrix.java }}'
          distribution: 'temurin'
          cache: 'gradle'

      # ---------- 3. 缓存 Gradle 依赖 ----------
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ---------- 4. 赋予 gradlew 执行权限 ----------
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ---------- 5. 执行构建 ----------
      - name: Build with Gradle
        run: ./gradlew build --no-daemon --console=plain

      # ---------- 6. 上传构建产物 ----------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MixinEnhance-build-${{ github.run_number }}
          path: |
            build/libs/*.jar
            build/libs/*-sources.jar
          retention-days: 30
          if-no-files-found: warn

  package:
    name: Package Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # ---------- 1. 检出代码 ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 2. 配置 JDK ----------
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # ---------- 3. 缓存 Gradle 依赖 ----------
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ---------- 4. 赋予 gradlew 执行权限 ----------
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ---------- 5. 执行发布构建（生成带版本号的 jar） ----------
      - name: Build release jar
        run: ./gradlew jar --no-daemon --console=plain

      # ---------- 6. 打包为 zip 归档 ----------
      - name: Create release package
        run: |
          mkdir -p release
          # 复制 jar 文件
          cp build/libs/*.jar release/
          # 复制 LICENSE
          cp LICENSE release/
          # 复制 README 说明
          cat > release/README.txt << 'EOF'
          MixinEnhance - Minecraft Fabric Mod
          ====================================
          版本: ${{ github.sha }}
          构建时间: ${{ github.event.head_commit.timestamp }}
          分支: ${{ github.ref_name }}
          
          依赖要求:
          - Minecraft 26.3
          - Fabric Loader 0.19.5
          - Fabric API 0.161.0+26.3
          
          安装方式:
          1. 确保已安装 Fabric Loader
          2. 将本文件复制到 Minecraft 的 .minecraft/mods 文件夹
          EOF
          # 打包为 zip
          cd release && zip -r ../MixinEnhance-release.zip . && cd ..

      # ---------- 7. 上传发布包 ----------
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: MixinEnhance-release
          path: MixinEnhance-release.zip
          retention-days: 30

      # ---------- 8. 创建 GitHub Release（仅打 tag 时） ----------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MixinEnhance-release.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
